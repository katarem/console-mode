name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: App de PC (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar ConsoleMode.exe
        run: >
          dotnet publish pc/ConsoleMode/ConsoleMode.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Crear instalador y versión portable
        shell: pwsh
        run: |
          $version = ([xml](Get-Content pc/ConsoleMode/ConsoleMode.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" "/DSourceExe=..\publish\ConsoleMode.exe" installer\ConsoleMode.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "installer\Output\ConsoleMode-Setup-$version.exe" dist\
          Copy-Item publish\ConsoleMode.exe "dist\ConsoleMode-$version-portable.exe"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleMode-windows
          path: dist/*

  android:
    name: App móvil (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Renombrar APK
        run: |
          version=$(sed -nE 's/^version: *([^+]+).*/\1/p' pubspec.yaml)
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/ConsoleMode-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleMode-android
          path: mobile/build/app/outputs/flutter-apk/ConsoleMode-*.apk

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
