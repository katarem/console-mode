name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Decide si hay que publicar una release y qué apps hay que compilar según lo que ha cambiado:
  # - push a main con una versión nueva (sin su etiqueta todavía): release vX.Y.Z con los cambios desde la etiqueta
  #   anterior. La etiqueta la crea el propio paso de publicar.
  # - push a main sin versión nueva: cambios del push (before..after), sin release
  # - etiqueta vX.Y.Z subida a mano: cambios desde la etiqueta anterior
  # - pull request: cambios respecto a la rama base
  # - lanzado a mano, primera etiqueta o sin historial: todo
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      pc: ${{ steps.diff.outputs.pc }}
      mobile: ${{ steps.diff.outputs.mobile }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # La etiqueta es la versión más alta de las dos apps (<Version> del .csproj y version: del pubspec.yaml). Si ya
      # existe, no hay nada que publicar: hay que subir la versión de alguna app para sacar una release.
      - id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pc=$(sed -nE 's#.*<Version>([0-9]+\.[0-9]+\.[0-9]+)</Version>.*#\1#p' pc/ConsoleMode/ConsoleMode.csproj | head -n1)
          mobile=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' mobile/pubspec.yaml)
          version=$(printf '%s\n' "$pc" "$mobile" | sed '/^$/d' | sort -V | tail -n1)
          echo "PC: $pc · Móvil: $mobile · Release: v$version"
          if [[ -z "$version" ]]; then
            echo "No se ha podido leer la versión: no se publica release"
          elif git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "La etiqueta v$version ya existe: no se publica release"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          NEW_TAG: ${{ steps.release.outputs.tag }}
        run: |
          base=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            base=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          elif [[ -n "$NEW_TAG" ]]; then
            # Release nueva desde main: lo que ha cambiado desde la etiqueta anterior.
            base=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          elif [[ "$EVENT" == pull_request ]]; then
            base="origin/$BASE_REF"
          elif [[ "$EVENT" == push ]]; then
            base="$BEFORE"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Sin base con la que comparar: se compila todo"
            echo "pc=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" HEAD)
          echo "Cambios desde $base:"
          echo "$changed"

          # Si cambia la propia CI, se compila todo para comprobarla.
          ci=false
          grep -q '^\.github/workflows/' <<< "$changed" && ci=true

          pc=false
          mobile=false
          if [[ $ci == true ]] || grep -qE '^(pc|installer)/' <<< "$changed"; then pc=true; fi
          if [[ $ci == true ]] || grep -qE '^mobile/' <<< "$changed"; then mobile=true; fi
          echo "pc=$pc" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "PC: $pc · Móvil: $mobile"

  windows:
    name: App de PC (Windows)
    needs: changes
    if: needs.changes.outputs.pc == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar ConsoleMode.exe
        run: >
          dotnet publish pc/ConsoleMode/ConsoleMode.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Crear instalador y versión portable
        shell: pwsh
        run: |
          $version = ([xml](Get-Content pc/ConsoleMode/ConsoleMode.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" "/DSourceExe=..\publish\ConsoleMode.exe" installer\ConsoleMode.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "installer\Output\ConsoleMode-Setup-$version.exe" dist\
          Copy-Item publish\ConsoleMode.exe "dist\ConsoleMode-$version-portable.exe"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleMode-windows
          path: dist/*

  android:
    name: App móvil (Android)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # La versión se incrusta en la app para que pueda buscar actualizaciones.
      - name: Compilar APK
        run: |
          version=$(sed -nE 's/^version: *([^+]+).*/\1/p' pubspec.yaml)
          flutter build apk --release --dart-define=APP_VERSION=$version

      - name: Renombrar APK
        run: |
          version=$(sed -nE 's/^version: *([^+]+).*/\1/p' pubspec.yaml)
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/ConsoleMode-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleMode-android
          path: mobile/build/app/outputs/flutter-apk/ConsoleMode-*.apk

  release:
    name: Publicar release
    # Se publica con lo que se haya compilado: si una app no ha cambiado desde la etiqueta anterior, su archivo no
    # se vuelve a subir (la app de esa plataforma busca su actualización en las releases anteriores).
    # En un push a main con versión nueva se crea aquí la etiqueta; también vale subir una etiqueta vX.Y.Z a mano.
    if: >
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.tag != '') &&
      needs.changes.result == 'success' &&
      needs.windows.result != 'failure' && needs.android.result != 'failure' &&
      (needs.windows.result == 'success' || needs.android.result == 'success')
    needs: [changes, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # Vacío en un push de etiqueta: se usa la propia etiqueta.
          tag_name: ${{ needs.changes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
